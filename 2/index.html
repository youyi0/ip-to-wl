<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CF 节点自动识别工具</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
            background-color: #f5f7fa;
            color: #333;
        }
        h2 { text-align: center; color: #2c3e50; }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 8px; }
        textarea {
            width: 100%;
            height: 180px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: monospace;
            resize: vertical;
        }
        .status {
            font-size: 13px;
            color: #666;
            margin-bottom: 10px;
        }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button {
            flex: 1;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #0056b3; }
        button.btn-copy { background-color: #28a745; }
        button.btn-copy:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="container">
    <h2>CF节点自动识别工具</h2>
    
    <!-- 输入区域 -->
    <div class="form-group">
        <label for="input">输入节点（支持 VLESS / VMess / Trojan / SS，每行一个）：</label>
        <textarea id="input" placeholder="支持识别 Cloudflare 官方全量 IP 段、IPv6 地址及域名特征..."></textarea>
    </div>

    <!-- 输出区域 -->
    <div class="form-group">
        <label for="output">处理结果：</label>
        <textarea id="output" readonly></textarea>
    </div>

    <div id="status" class="status">CF 官方 IP 库加载状态：内置全量官方 CIDR 已就绪</div>

    <!-- 按钮组（放在输出框下方） -->
    <div class="btn-group">
        <button onclick="processNodes()">开始处理</button>
        <button class="btn-copy" onclick="copyResult()">复制结果</button>
    </div>
</div>

<script>
// Cloudflare 官方 IPv4 & IPv6 全量网段库
const cfIPv4Cidrs = [
    "103.21.244.0/22", "103.22.200.0/22", "103.31.4.0/22", "104.16.0.0/13",
    "104.24.0.0/14", "108.162.192.0/18", "131.0.72.0/22", "141.101.64.0/18",
    "162.158.0.0/15", "172.64.0.0/13", "173.245.48.0/20", "188.114.96.0/20",
    "190.93.240.0/20", "197.234.240.0/22", "198.41.128.0/17"
];

const cfIPv6Prefixes = [
    "2400:cb00:", "2606:4700:", "2803:f800:", "2405:b500:", "2405:8100:", "2a06:98c0:", "2c0f:f248:"
];

// UTF-8 安全 Base64
function safeUtf8ToBase64(str) {
    return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (m, p1) => String.fromCharCode('0x' + p1)));
}

function safeBase64ToUtf8(str) {
    return decodeURIComponent(atob(str).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
}

// IP 转 Int32
function ipToLong(ip) {
    return ip.split('.').reduce((acc, octet) => (acc << 8) + parseInt(octet, 10), 0) >>> 0;
}

// CIDR 匹配函数
function ipInCidr(ip, cidr) {
    const [range, bits = 32] = cidr.split('/');
    const mask = ~(2 ** (32 - bits) - 1);
    return (ipToLong(ip) & mask) === (ipToLong(range) & mask);
}

// 检测节点配置是否命中 CF
function isCloudflareNode(contentStr) {
    // 1. 域名与服务关键词判定
    const domainRegex = /cloudflare|workers\.dev|pages\.dev|cfcdn|cdn|1\.1\.1\.1|1\.0\.0\.1/i;
    if (domainRegex.test(contentStr)) return true;

    // 2. 提取配置中的所有 IPv4 进行官方网段比对
    const ipv4Matches = contentStr.match(/\b(?:\d{1,3}\.){3}\d{1,3}\b/g);
    if (ipv4Matches) {
        for (const ip of ipv4Matches) {
            for (const cidr of cfIPv4Cidrs) {
                if (ipInCidr(ip, cidr)) return true;
            }
        }
    }

    // 3. 提取 IPv6 匹配
    for (const prefix of cfIPv6Prefixes) {
        if (contentStr.toLowerCase().includes(prefix.toLowerCase())) return true;
    }

    return false;
}

function processNodes() {
    const rawInput = document.getElementById('input').value.trim();
    if (!rawInput) {
        alert('请先输入节点数据！');
        return;
    }

    const lines = rawInput.split('\n');
    const resultLines = [];

    lines.forEach(line => {
        let trimmed = line.trim();
        if (!trimmed) return;

        let processedLine = trimmed;

        if (trimmed.startsWith('vmess://')) {
            try {
                let b64 = trimmed.replace('vmess://', '');
                let jsonStr = safeBase64ToUtf8(b64);
                let config = JSON.parse(jsonStr);

                const isCF = isCloudflareNode(jsonStr);
                const prefix = isCF ? 'CF-' : 'nCF-';

                let originalPs = config.ps || 'Node';
                originalPs = originalPs.replace(/^(CF-|nCF-)/i, '');
                config.ps = prefix + originalPs;

                processedLine = 'vmess://' + safeUtf8ToBase64(JSON.stringify(config));
            } catch (e) {
                processedLine = trimmed;
            }
        } else {
            const isCF = isCloudflareNode(trimmed);
            const prefix = isCF ? 'CF-' : 'nCF-';

            const hashIndex = trimmed.indexOf('#');
            if (hashIndex !== -1) {
                const mainUrl = trimmed.substring(0, hashIndex + 1);
                let name = decodeURIComponent(trimmed.substring(hashIndex + 1));
                
                name = name.replace(/^(CF-|nCF-)/i, '');
                processedLine = mainUrl + encodeURIComponent(prefix + name);
            } else {
                processedLine = trimmed + '#' + encodeURIComponent(prefix + 'Node');
            }
        }

        resultLines.push(processedLine);
    });

    document.getElementById('output').value = resultLines.join('\n');
}

function copyResult() {
    const output = document.getElementById('output');
    if (!output.value) {
        alert('没有可复制的内容！');
        return;
    }
    output.select();
    document.execCommand('copy');
    alert('已成功复制到剪贴板！');
}
</script>

</body>
</html>

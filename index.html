<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>VLESS 智能节点提取和裂变器</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f7fa; padding: 20px; }
    .container { max-width: 780px; margin: auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 0 12px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #333; margin-bottom: 25px; font-size: 22px; }
    h2 { font-size: 16px; margin-top: 15px; color: #444; }
    textarea {
      width: 100%;
      height: 140px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      resize: vertical;
      font-size: 14px;
      white-space: pre;       /* 不自动换行 */
      overflow: auto;         /* 开启横向+纵向滚动条 */
      box-sizing: border-box;
    }
    button {
      flex: 1;                /* 按钮自动平分宽度 */
      padding: 14px;
      background: #4a8cf7;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #3a7be0; }
    .btn-copy { background: #28a745; }
    .btn-copy:hover { background: #218838; }
    .output {
      margin-top: 10px;
      padding: 15px;
      background: #eef3ff;
      border-radius: 8px;
      font-size: 14px;
      white-space: pre;
      overflow: auto;
      height: 200px;
      box-sizing: border-box;
    }
    .btn-row { 
      display: flex; 
      justify-content: space-between; 
      gap: 12px; 
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 VLESS 智能节点提取和裂变器</h1>

    <h2>第一步：粘贴你的原始 VLESS 节点链接</h2>
    <textarea id="vlessInput" placeholder="粘贴完整 vless:// 链接" onpaste="resetScroll(this)"></textarea>
    
    <h2>第二步：粘贴 Cloudflare 优选 IP 或域名</h2>
    <textarea id="cfInput" placeholder="多行格式：域名(IP):端口#名称" onpaste="resetScroll(this)"></textarea>
    
    <h2>结果</h2>
    <textarea id="output" class="output" readonly></textarea>
    
    <div class="btn-row">
      <button onclick="extract()">提取 IP+端口</button>
      <button onclick="generate()">生成优选节点</button>
      <button class="btn-copy" onclick="copyOutput()">复制结果</button>
    </div>
  </div>

  <script>
    // 粘贴时自动重置滚动条置顶靠左
    function resetScroll(el) {
      setTimeout(() => {
        el.scrollTop = 0;
        el.scrollLeft = 0;
      }, 10);
    }

    // 提取域名/IP:端口#名称 (支持 URL 编码解码)
    function extract() {
      const text = document.getElementById("cfInput").value.trim();
      const lines = text.split("\n").map(x => x.trim()).filter(x => x);
      let result = [];

      lines.forEach(line => {
        if (!line.startsWith("vless://")) return;
        try {
          const url = new URL(line);
          const host = url.hostname;
          const port = url.port || "443";
          
          let rawName = line.split("#")[1] || "";
          let name = rawName;
          try {
            name = decodeURIComponent(rawName);
          } catch (e) {
            name = rawName;
          }

          result.push(`${host}:${port}#${name}`);
        } catch(e) {}
      });

      const outputEl = document.getElementById("output");
      outputEl.value = result.join("\n");
      outputEl.scrollTop = 0;
      outputEl.scrollLeft = 0;
    }

    // 生成优选节点
    function generate() {
      const raw = document.getElementById("vlessInput").value.trim();
      const cf = document.getElementById("cfInput").value.trim();
      const outputEl = document.getElementById("output");

      if (!raw.startsWith("vless://")) {
        outputEl.value = "原始节点格式错误";
        return;
      }

      try {
        const base = new URL(raw);
        const uuid = base.username;
        const params = base.search;
        const nameBase = raw.split("#")[1] || "";

        const lines = cf.split("\n").map(x => x.trim()).filter(x => x);
        let result = [];

        lines.forEach(line => {
          const parts = line.split("#");
          const hostPort = parts[0];
          const name = parts[1] || nameBase;
          const hp = hostPort.split(":");
          const host = hp[0];
          const port = hp[1] || base.port || "443";

          result.push(`vless://${uuid}@${host}:${port}${params}#${name}`);
        });

        outputEl.value = result.join("\n");
        outputEl.scrollTop = 0;
        outputEl.scrollLeft = 0;
      } catch (e) {
        outputEl.value = "解析失败，请检查节点格式";
      }
    }

    // 复制结果全部文本
    function copyOutput() {
      const outputText = document.getElementById("output").value;
      if (!outputText) {
        alert("结果框为空，无法复制！");
        return;
      }
      navigator.clipboard.writeText(outputText).then(() => {
        alert("已成功复制到剪贴板！");
      }).catch(err => {
        alert("复制失败，请手动选择复制");
      });
    }
  </script>
</body>
</html>
